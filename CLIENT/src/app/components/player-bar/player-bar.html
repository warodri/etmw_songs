@if (player.currentSong(); as song) {
<footer class="player-bar">
    <div class="player-bar__inner">
        <div class="player-bar__song">
            <div class="player-bar__art">♪</div>
            <div class="player-bar__meta">
                <strong>{{ song.title }}</strong>
                <span>{{ song.tags.slice(0, 3).join(' · ') }}</span>
            </div>
        </div>

        <div class="player-bar__center">
            <div class="player-bar__controls">
                <button type="button" class="player-bar__control" (click)="player.previous()" [disabled]="!player.hasPrevious()" aria-label="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 5h2v14H6zm12 0v14l-10-7z"/></svg>
                </button>
                <button type="button" class="player-bar__control player-bar__control--main" (click)="player.toggle()" aria-label="Play or pause">
                    @if (player.isLoading()) {
                        <span class="player-bar__spinner"></span>
                    } @else if (player.isPlaying()) {
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
                    } @else {
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
                    }
                </button>
                <button type="button" class="player-bar__control" (click)="player.next()" [disabled]="!player.hasNext()" aria-label="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 5h2v14h-2zM6 5l10 7-10 7z"/></svg>
                </button>
            </div>

            <div class="player-bar__timeline">
                <span>{{ formatDuration(player.currentTime()) }}</span>
                <div class="player-bar__range-wrap">
                    <input class="player-bar__range" type="range" min="0" [max]="player.duration() || 0" step="0.1" [value]="player.currentTime()" (input)="seek($event)" />
                    <span class="player-bar__range-progress" [style.width.%]="progress()"></span>
                </div>
                <span>{{ formatDuration(player.duration()) }}</span>
            </div>
        </div>

        <div class="player-bar__side">
            <div class="player-bar__volume">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
                <input type="range" min="0" max="1" step="0.01" [value]="player.volume()" (input)="changeVolume($event)" />
            </div>
            <button type="button" class="player-bar__close" (click)="player.close()" aria-label="Close player">×</button>
        </div>
    </div>
</footer>
}
